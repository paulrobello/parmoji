[project]
name = "parmoji"
dynamic = ["version"]
description = "Pillow-based emoji rendering with HTTP and local sources"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Paul Robello", email = "probello@gmail.com" }]
maintainers = [{ name = "Paul Robello", email = "probello@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
keywords = ["emoji", "pillow", "renderer", "discord", "twemoji"]
dependencies = [
  # SEC-004: conservative major-version upper bounds on the security-sensitive
  # image/network deps so a future breaking or vulnerable release does not
  # auto-install downstream. xdg-base-dirs is left unbounded (not security-
  # sensitive; bounding risks resolver harm for no benefit).
  "pillow>=12.3.0,<14",
  "emoji>=2.15.0,<3",
  "httpx>=0.28.1,<1",
  "requests>=2.34.2,<3",
  "xdg-base-dirs>=6.0.2",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/paulrobello/parmoji"
Repository = "https://github.com/paulrobello/parmoji"
Issues = "https://github.com/paulrobello/parmoji/issues"

[build-system]
requires = ["hatchling", "wheel"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "pytest-timeout>=2.3.1",
  "ruff>=0.16.1",
  "pyright>=1.1.411",
  "hatchling>=1.31.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# QA-Low: replaces the former hand-rolled SIGALRM/thread timeout hook in
# conftest.py. 15s is generous for these unit tests; the default thread method
# is cross-platform (no signal dependency).
timeout = 15

[tool.hatch.version]
path = "src/parmoji/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/parmoji"]
include = ["py.typed", "**/*.py", "**/*.md", "**/*.png", "**/*.jpg", "**/*.gif"]

[tool.hatch.build.targets.sdist]
include = ["src/parmoji", "LICENSE", "README.md", "pyproject.toml"]
exclude = ["*.pyc", "__pycache__", "*.so", "*.dylib"]
